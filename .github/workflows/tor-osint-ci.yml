name: tor-osint CI

on:
  pull_request:
    paths:
      - 'tor-osint/**'
      - '.github/workflows/tor-osint-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'tor-osint/**'
      - '.github/workflows/tor-osint-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    defaults:
      run:
        working-directory: tor-osint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tor-osint/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest
